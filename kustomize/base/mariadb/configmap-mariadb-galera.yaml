---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mariadb-config
  labels:
    app: mariadb
    component: config
    managed-by: k8s
    role: galera
data:
  custom.cnf: |

    [mysqld]
    skip-name-resolve
    skip-slave-start
    character-set-server = utf8mb4
    collation-server = utf8mb4_unicode_ci
    bind-address = 0.0.0.0
    sql_mode = STRICT_TRANS_TABLES,NO_ENGINE_SUBSTITUTION

    log_bin = mysql-bin
    binlog_format = ROW
    server_id = _SERVER_ID
    binlog_row_image = FULL
    log_slave_updates = ON
    gtid_strict_mode = ON
    expire_logs_days = 7
    sync_binlog = 1

    innodb_flush_log_at_trx_commit = 1
    innodb_buffer_pool_size = 2Gi
    innodb_log_file_size = 128M
    innodb_flush_method = O_DIRECT

    max_connect_errors = 10000
    max_connections = 500
    wait_timeout = 600
    interactive_timeout = 600

    query_cache_size = 0
    query_cache_type = 0

    slow_query_log = 1
    slow_query_log_file = /var/lib/mysql/mariadb-slow.log
    long_query_time = 2
    log_queries_not_using_indexes = 1
    log_output = FILE

    [galera]
    wsrep_on = ON
    wsrep_provider = /usr/lib/galera/libgalera_smm.so
    wsrep_cluster_name = _MARIADB_CLUSTER_NAME
    wsrep_cluster_address = _MARIADB_CLUSTER_ADDRESS
    wsrep_node_address = _POD_IP
    wsrep_sst_method = mariabackup
    wsrep_slave_threads = 4
    wsrep_retry_autocommit = 3
    wsrep_provider_options = "gcache.size=512M;evs.suspect_timeout=PT5S;evs.inactive_timeout=PT15S;evs.install_timeout=PT5S;evs.send_window=512;evs.user_send_window=256"

    [mariadb]
    transaction-isolation = READ-COMMITTED
    default_storage_engine = InnoDB
    innodb_autoinc_lock_mode = 2

    [xtrabackup]
    user = _SST_USER
    password = "_SST_PASSWORD"