    - IMAGE_TAG="stg-${CI_COMMIT_SHORT_SHA}"
    - echo "[$(date '+%d/%m/%Y %H:%M:%S')] [INFO] Setting image to ${DOCKER_IMAGE}:${IMAGE_TAG}"
