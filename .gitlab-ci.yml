        if kubectl get application ${APP_NAME}-stg -n argocd &>/dev/null; then
          echo "[$(date '+%d/%m/%Y %H:%M:%S')] [OK] Application ${APP_NAME}-stg criada"
          FOUND_APP=1
          break
