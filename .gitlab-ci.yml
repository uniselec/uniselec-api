      if [ -z "${ARGOCD_PASSWORD}" ]; then
        echo "[$(date '+%d/%m/%Y %H:%M:%S')] [ERROR] Credenciais admin não encontrada"
        kubectl get secret argocd-initial-admin-secret -n argocd
        exit 1
      fi

    - |
      if ! command -v argocd &>/dev/null; then
        echo "[$(date '+%d/%m/%Y %H:%M:%S')] [ERROR] argocd CLI não está instalado"
