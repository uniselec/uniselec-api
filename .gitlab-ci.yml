        echo "[$(date '+%d/%m/%Y %H:%M:%S')] [INFO] Verificando ApplicationSet"
        kubectl get applicationset -n argocd | grep ${APP_NAME} || echo "[WARN] ApplicationSet não encontrado"
        exit 1
      fi

      echo "[$(date '+%d/%m/%Y %H:%M:%S')] [INFO] Aguardando sync da application"
