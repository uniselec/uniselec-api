# ══════════════════════════════════════════════════════════════════════════════
# GitLab CI/CD Pipeline - GitOps
# ══════════════════════════════════════════════════════════════════════════════
# Padrões: GitLab CE CI/CD, GitOps, Kubernetes Best Practices
# Arquitetura: Dual-mode GitOps (controlado por GITOPS_MODE)
#   single-cluster : ArgoCD e workloads no mesmo cluster
#   hub-spoke      : ArgoCD no Hub (C1) gerencia Spoke remoto (C2)
# Projeto: cicd-gitops
# ══════════════════════════════════════════════════════════════════════════════

stages:
  - validate
  - tests
  - build
  - development
  - staging
  - notification
  - approval
  - production
  - notify

.load_k8s_secrets: &load_k8s_secrets |
  set -euo pipefail

  # Default seguro: garante que ARGOCD_TLS_OPTS existe mesmo se o bloco
  # de inicialização não for atingido (ex: saída antecipada por erro RBAC)
  export ARGOCD_TLS_OPTS="--insecure"

  read_secret() {
    kubectl get secret -n "$1" "$2" -o jsonpath="{.data.$3}" | base64 -d
  }

  export TOKEN_PAT_NAME="$(read_secret ci-cd git-credentials username)"
  export TOKEN_PAT_ACCESS="$(read_secret ci-cd git-credentials token)"
  export KUBECONFIG_HA="$(kubectl get secret -n argocd kubeconfig-ha -o jsonpath='{.data.kubeconfig\.yaml}' 2>/dev/null | tr -d '\n')"
  if [[ -z "${KUBECONFIG_HA}" ]]; then
    export KUBECONFIG_HA="$(kubectl get secret -n argocd kubeconfig-c2 -o jsonpath='{.data.kubeconfig\.yaml}' 2>/dev/null | tr -d '\n')"
  fi

  # Switching GitOps mode: single-cluster | hub-spoke
  # single-cluster: ArgoCD e workloads no mesmo cluster (kubernetes.default.svc)
  # hub-spoke:      ArgoCD no Hub gerencia Spoke remoto (HUB_SPOKE_DEST_SERVER)
  if [[ "${GITOPS_MODE}" == "hub-spoke" ]]; then
    export ARGOCD_DEST_SERVER="${HUB_SPOKE_DEST_SERVER}"
    echo "[INFO] GitOps mode: hub-spoke | dest: ${ARGOCD_DEST_SERVER}"
  else
    export ARGOCD_DEST_SERVER="https://kubernetes.default.svc"
    echo "[INFO] GitOps mode: single-cluster | dest: ${ARGOCD_DEST_SERVER}"
  fi

  # TLS mode: insecure (default) | server-crt (certificado explícito)
  # Para ativar: definir ARGOCD_TLS_MODE=server-crt e ARGOCD_SERVER_CRT_B64=<base64 do cert>
  if [[ "${ARGOCD_TLS_MODE}" == "server-crt" ]] && [[ -n "${ARGOCD_SERVER_CRT_B64}" ]]; then
    echo "${ARGOCD_SERVER_CRT_B64}" | base64 -d > /tmp/argocd-server.crt
    export ARGOCD_TLS_OPTS="--server-crt /tmp/argocd-server.crt"
    echo "[INFO] ArgoCD TLS mode: server-crt"
  else
    export ARGOCD_TLS_OPTS="--insecure"
    echo "[INFO] ArgoCD TLS mode: insecure (default)"
  fi

  HARBOR_AUTH="$(kubectl get secret -n ci-cd regcred -o jsonpath='{.data.\.dockerconfigjson}' | base64 -d | jq -r --arg reg "$HARBOR_REGISTRY" '.auths[$reg].auth // empty')"
  if [[ -n "$HARBOR_AUTH" ]]; then
    DECODED_AUTH="$(echo "$HARBOR_AUTH" | base64 -d)"
    export HARBOR_USERNAME="${DECODED_AUTH%%:*}"
    export HARBOR_PASSWORD="${DECODED_AUTH#*:}"
  fi

  export SONAR_TOKEN="$(read_secret ci-cd sonar-credentials token 2>/dev/null || read_secret ci-cd sonar-credentials login)"

default:
  before_script:
    - *load_k8s_secrets

# Globais
variables:
  # Projeto
  APP_NAME: uniselec-api
  GIT_BRANCH: "main"
  # Repositório Git
  REPO_URL: "https://gitlab.unilab.edu.br/dti/uniselec-api.git"
  REPO_DOMAIN: "gitlab.unilab.edu.br"
  REPO_PATH: "dti/uniselec-api"
  GIT_AUTHOR_NAME: "GitLab CI"
  GIT_AUTHOR_EMAIL: "gitlab-ci@unilab.edu.br"
  # Domínios
  DOMAIN_DEV: "uniselec-api-development.unilab.edu.br"
  DOMAIN_STAG: "uniselec-api-staging.unilab.edu.br"
  DOMAIN_PROD: "uniselec-api.unilab.edu.br"
  # Container Registry
  HARBOR_REGISTRY: "harbor.unilab.edu.br"
  DOCKER_IMAGE: "${HARBOR_REGISTRY}/unilab/${APP_NAME}"
  BASE_IMAGE: "harbor.unilab.edu.br/unilab/ubuntu-k8s-tools:latest"
  # Kubernetes/ArgoCD
  # Para alternar modo: mudar GITOPS_MODE para "hub-spoke" ou "single-cluster"
  # ARGOCD_DEST_SERVER e sobrescrito em runtime pelo load_k8s_secrets
  ARGOCD_SERVER: "gitops.unilab.edu.br"        # Ingress do ArgoCD (Hub/unico cluster)
  GITOPS_MODE: "single-cluster"                # single-cluster | hub-spoke
  ARGOCD_DEST_SERVER: "https://kubernetes.default.svc"        # default: single-cluster
  HUB_SPOKE_DEST_SERVER: "https://k8s-c2.unilab.edu.br:8443" # usado se hub-spoke
  CLUSTER_REMOTE1_DOMAIN: "k8s-c2.unilab.edu.br"             # dominio do Spoke (C2)
  KUBECONFIG: "/tmp/kubeconfig-${CI_PIPELINE_ID}"
  ARGOCD_TIMEOUT_DEV: "600"   # 10 minutos
  ARGOCD_TIMEOUT_STG: "900"   # 15 minutos
  ARGOCD_TIMEOUT_PRD: "1200"  # 20 minutos
  ARGOCD_TLS_MODE: "insecure"      # insecure | server-crt
  ARGOCD_SERVER_CRT_B64: ""        # base64 do cert TLS do ArgoCD (quando server-crt)

  # Notificação
  MAIL_PRD: "erivandosena@gmail.com"

# STAGE 1
validate:environment:
  stage: validate
  image: ${BASE_IMAGE}
  tags:
    - kubernetes
  interruptible: true
  retry:
    max: 1
    when:
      - runner_system_failure
  timeout: 5m
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
  script:
    - echo "[$(date '+%d/%m/%Y %H:%M:%S')] [INFO] Validando ambiente e pré-requisitos"
    - |
      ERRORS=0

      # Git
      if [[ -z "${TOKEN_PAT_NAME}" ]]; then
        echo "[$(date '+%d/%m/%Y %H:%M:%S')] [ERROR] TOKEN_PAT_NAME não está definida"
        ERRORS=$((ERRORS+1))
      else
        echo "[$(date '+%d/%m/%Y %H:%M:%S')] [OK] TOKEN_PAT_NAME presente"
      fi

      if [[ -z "${TOKEN_PAT_ACCESS}" ]]; then
        echo "[$(date '+%d/%m/%Y %H:%M:%S')] [ERROR] TOKEN_PAT_ACCESS não está definida"
        ERRORS=$((ERRORS+1))
      else
        echo "[$(date '+%d/%m/%Y %H:%M:%S')] [OK] TOKEN_PAT_ACCESS presente"
      fi

      # Kubernetes
      if [[ -z "${KUBECONFIG_HA}" ]]; then
        echo "[$(date '+%d/%m/%Y %H:%M:%S')] [ERROR] KUBECONFIG_HA não está definida"
        ERRORS=$((ERRORS+1))
      else
        echo "[$(date '+%d/%m/%Y %H:%M:%S')] [OK] KUBECONFIG_HA presente"
      fi

      # Harbor
      if [[ -z "${HARBOR_USERNAME}" ]]; then
        echo "[ERROR] HARBOR_USERNAME não está definida"
        ERRORS=$((ERRORS+1))
      else
        echo "[$(date '+%d/%m/%Y %H:%M:%S')] [OK] HARBOR_USERNAME presente"
      fi

      if [[ -z "${HARBOR_PASSWORD}" ]]; then
        echo "[$(date '+%d/%m/%Y %H:%M:%S')] [ERROR] HARBOR_PASSWORD não está definida"
        ERRORS=$((ERRORS+1))
      else
        echo "[$(date '+%d/%m/%Y %H:%M:%S')] [OK] HARBOR_PASSWORD presente"
      fi

      # SonarQube
      if [[ -z "${SONAR_TOKEN}" ]]; then
        echo "[$(date '+%d/%m/%Y %H:%M:%S')] [ERROR] SONAR_TOKEN não está definida"
        ERRORS=$((ERRORS+1))
      else
        echo "[$(date '+%d/%m/%Y %H:%M:%S')] [OK] SONAR_TOKEN presente"
      fi

      if [[ $ERRORS -gt 0 ]]; then
        echo "[$(date '+%d/%m/%Y %H:%M:%S')] [ERROR] $ERRORS variáveis críticas faltando!"
        exit 1
      fi

# STAGE 2
validate:kustomize:
  stage: validate
  image: ${BASE_IMAGE}
  tags:
    - kubernetes
  interruptible: true
  retry:
    max: 1
    when:
      - runner_system_failure
  timeout: 5m
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
  script:
    - echo "[$(date '+%d/%m/%Y %H:%M:%S')] [INFO] Validando kustomize overlays"
    - |
      if [[ "${CI_COMMIT_BRANCH:-}" == "develop" ]]; then
        echo "[$(date '+%d/%m/%Y %H:%M:%S')] [CHECK] Development overlay"
        kubectl kustomize kustomize/overlays/development -o yaml > /tmp/development-manifest.yaml
      fi
    - |
      if [[ "${CI_COMMIT_BRANCH:-}" == "main" ]] || [[ -n "${CI_COMMIT_TAG:-}" ]]; then
        echo "[$(date '+%d/%m/%Y %H:%M:%S')] [CHECK] Staging overlay"
        kubectl kustomize kustomize/overlays/staging -o yaml > /tmp/staging-manifest.yaml
        echo "[$(date '+%d/%m/%Y %H:%M:%S')] [CHECK] Production overlay"
        kubectl kustomize kustomize/overlays/production -o yaml > /tmp/production-manifest.yaml
      fi

# STAGE 3
validate:docker:
  stage: validate
  image: ${BASE_IMAGE}
  tags:
    - kubernetes
  interruptible: true
  retry:
    max: 1
    when:
      - runner_system_failure
  timeout: 5m
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
  script:
    - echo "[$(date '+%d/%m/%Y %H:%M:%S')] [INFO] Validando Dockerfile"
    - docker build --help > /dev/null 2>&1 && echo "[$(date '+%d/%m/%Y %H:%M:%S')] [OK] Docker CLI disponível"
    - test -f ./Dockerfile && echo "[OK] Dockerfile encontrado"
    - docker run --rm -i hadolint/hadolint < ./Dockerfile && echo "[OK] Dockerfile lint passed" || true

# STAGE 4
tests:unit:
  stage: tests
  image: ${BASE_IMAGE}
  tags:
    - kubernetes
  interruptible: true
  retry:
    max: 1
    when:
      - runner_system_failure
  cache:
    key:
      files:
        - ./package-lock.json
    paths:
      - ./node_modules/
      - .npm/
    policy: pull-push
  timeout: 15m
  variables:
    NODE_ENV: test
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
  before_script:
    - *load_k8s_secrets
    - echo "[$(date '+%d/%m/%Y %H:%M:%S')] [INFO] Iniciando testes unitários"
    - |
      if [ -d .git ] && [ -f .git/shallow ]; then
        echo "[$(date '+%d/%m/%Y %H:%M:%S')] [INFO] Descarregando git history completo"
        git fetch --unshallow
      fi
    - cd .
  script:
    - echo "[$(date '+%d/%m/%Y %H:%M:%S')] [INFO] Limpezas"
    - npm cache clean --force
    - echo "[$(date '+%d/%m/%Y %H:%M:%S')] [INFO] Instalando dependências"
    - npm install --legacy-peer-deps
    - echo "[$(date '+%d/%m/%Y %H:%M:%S')] [INFO] Executando testes com coverage"
    - npm test -- --coverage || true
    - echo "[$(date '+%d/%m/%Y %H:%M:%S')] [INFO] Executando lint"
    - npm run lint 2>/dev/null || echo "[WARN] Lint não configurado"
    - echo "[$(date '+%d/%m/%Y %H:%M:%S')] [OK] Testes unitários passaram"
  artifacts:
    when: always
    reports:
      junit: ./coverage/junit.xml
      coverage_report:
        coverage_format: cobertura
        path: ./coverage/cobertura-coverage.xml
    paths:
      - ./coverage/
    expire_in: 30 days
  allow_failure: true

# STAGE 5
tests:dependency_check:
  stage: tests
  image: ${BASE_IMAGE}
  tags:
    - kubernetes
  interruptible: true
  retry:
    max: 2
    when:
      - runner_system_failure
      - api_failure
      - stuck_or_timeout_failure
  timeout: 10m
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
  allow_failure: true
  before_script:
    - *load_k8s_secrets
    - cd .
  script:
    - echo "[$(date '+%d/%m/%Y %H:%M:%S')] [INFO] Verificando vulnerabilidades de dependências"
    - npm audit --json > /tmp/npm-audit.json || true
    - npm audit --audit-level=moderate 2>&1 | head -50 || true
  artifacts:
    paths:
      - /tmp/npm-audit.json
    expire_in: 30 days

# STAGE 6
tests:sast_scan:
  stage: tests
  image: ${BASE_IMAGE}
  tags:
    - kubernetes
  retry:
    max: 1
    when:
      - runner_system_failure
  timeout: 10m
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
  allow_failure: true
  script:
    - echo "[$(date '+%d/%m/%Y %H:%M:%S')] [INFO] Executando SAST scanning"
    - cd . || true
    - trivy fs --format json --output /tmp/trivy-report.json . 2>/dev/null || true
  artifacts:
    paths:
      - /tmp/trivy-report.json
    expire_in: 30 days
  interruptible: true

# STAGE 7
tests:sonarqube:
  stage: tests
  image: ${BASE_IMAGE}
  tags:
    - kubernetes
  interruptible: true
  retry:
    max: 1
    when:
      - runner_system_failure
  timeout: 20m
  variables:
    SONAR_HOST_URL: "https://sonar.unilab.edu.br"
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
  script:
    - echo "[$(date '+%d/%m/%Y %H:%M:%S')] [INFO] Análise de qualidade SonarQube"
    - |
      if ! curl -sk --max-time 10 "${SONAR_HOST_URL}/api/system/status" \
          2>/dev/null | grep -q '"status":"UP"'; then
        echo "[WARN] SonarQube indisponível em ${SONAR_HOST_URL} — análise ignorada"
        exit 0
      fi
    - |
      sonar-scanner \
        -Dsonar.projectKey=${CI_PROJECT_NAME} \
        -Dsonar.projectName=${CI_PROJECT_NAME} \
        -Dsonar.projectVersion=${CI_COMMIT_SHA} \
        -Dsonar.host.url=${SONAR_HOST_URL} \
        -Dsonar.token=${SONAR_TOKEN} \
        -Dsonar.sources=./ \
        -Dsonar.exclusions="vendor/**,storage/**,bootstrap/**,public/**" \
        -Dsonar.php.coverage.reportPaths=coverage.xml \
        -Dsonar.javascript.lcov.reportPaths=./coverage/lcov.info \
        -Dsonar.qualitygate.wait=true \
        -Dsonar.qualitygate.timeout=300
    - echo "[$(date '+%d/%m/%Y %H:%M:%S')] [OK] Quality gate passou"
  allow_failure: false

# STAGE 8
build:docker:
  stage: build
  image: ${BASE_IMAGE}
  tags:
    - kubernetes
  interruptible: true
  retry:
    max: 2
    when:
      - runner_system_failure
      - script_failure
  timeout: 30m
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
  before_script:
    - *load_k8s_secrets
    - echo "[$(date '+%d/%m/%Y %H:%M:%S')] [INFO] Iniciando build Docker daemon"
    - |
      rm -f /var/run/docker.sock
      dockerd --host=unix:///var/run/docker.sock \
              --storage-driver=overlay2 \
              --config-file=/etc/docker/daemon.json \
              &>/var/log/dockerd.log &
      timeout 34 sh -c 'until docker info &>/dev/null 2>&1; do sleep 1; done' \
        || { echo "[$(date '+%d/%m/%Y %H:%M:%S')] [ERROR] Docker daemon nao iniciou:"; cat /var/log/dockerd.log; exit 1; }
    - |
      echo "${HARBOR_PASSWORD}" | docker login ${HARBOR_REGISTRY} \
        -u "${HARBOR_USERNAME}" \
        --password-stdin
      if [ $? -eq 0 ]; then
        echo "[$(date '+%d/%m/%Y %H:%M:%S')] [OK] Harbor login bem-sucedido"
      else
        echo "[$(date '+%d/%m/%Y %H:%M:%S')] [ERROR] Falha no Harbor login"
        exit 1
      fi
    - cd .
  script:
    - |
      echo "[$(date '+%d/%m/%Y %H:%M:%S')] [INFO] Tag da imagem docker"
      if [[ "${CI_COMMIT_BRANCH:-}" == "develop" ]]; then
        IMAGE_TAG="dev-${CI_COMMIT_SHORT_SHA}"
        DOCKER_TAGS="--tag ${DOCKER_IMAGE}:${IMAGE_TAG} --tag ${DOCKER_IMAGE}:dev"
      elif [[ -n "${CI_COMMIT_TAG:-}" ]]; then
        IMAGE_TAG="${CI_COMMIT_TAG:-}"
        DOCKER_TAGS="--tag ${DOCKER_IMAGE}:${IMAGE_TAG}"
      else
        IMAGE_TAG="stg-${CI_COMMIT_SHORT_SHA}"
        DOCKER_TAGS="--tag ${DOCKER_IMAGE}:${IMAGE_TAG} --tag ${DOCKER_IMAGE}:latest"
      fi
      echo "[$(date '+%d/%m/%Y %H:%M:%S')] [INFO] IMAGE_TAG=${IMAGE_TAG}"

    - |
      echo "[$(date '+%d/%m/%Y %H:%M:%S')] [INFO] Build da imagem docker"
      docker build \
        --no-cache \
        ${DOCKER_TAGS} \
        --build-arg BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ') \
        --build-arg VCS_REF=${CI_COMMIT_SHA} \
        --build-arg VERSION=${CI_COMMIT_TAG:-${CI_COMMIT_SHORT_SHA}} \
        .

    - |
      echo "[$(date '+%d/%m/%Y %H:%M:%S')] [INFO] Scanning de vulnerabilidades"
      if [[ "${CI_COMMIT_BRANCH:-}" == "develop" ]]; then
        trivy image --severity HIGH,CRITICAL ${DOCKER_IMAGE}:dev || true
      elif [[ -n "${CI_COMMIT_TAG:-}" ]]; then
        trivy image --severity HIGH,CRITICAL ${DOCKER_IMAGE}:${CI_COMMIT_TAG} || true
      else
        trivy image --severity HIGH,CRITICAL ${DOCKER_IMAGE}:latest || true
      fi

    - |
      echo "[$(date '+%d/%m/%Y %H:%M:%S')] [INFO] Push para Harbor registry"
      docker push ${DOCKER_IMAGE}:${IMAGE_TAG}

      if [[ "${CI_COMMIT_BRANCH:-}" == "develop" ]]; then
        docker push ${DOCKER_IMAGE}:dev
      elif [[ "${CI_COMMIT_BRANCH:-}" == "main" ]]; then
        docker push ${DOCKER_IMAGE}:latest
      fi

    - |
      if [[ "${CI_COMMIT_BRANCH:-}" == "develop" ]]; then
        echo "  • ${DOCKER_IMAGE}:dev (DEVELOPMENT)"
      elif [[ -n "${CI_COMMIT_TAG:-}" ]]; then
        echo "  • ${DOCKER_IMAGE}:${CI_COMMIT_TAG} (PRODUCTION)"
      else
        echo "  • ${DOCKER_IMAGE}:latest (STAGING)"
      fi
      echo "[$(date '+%d/%m/%Y %H:%M:%S')] [OK] Image build e push concluídos"
  after_script:
    - |
      echo "[$(date '+%d/%m/%Y %H:%M:%S')] [INFO] Limpeza"

      [[ -z "$HARBOR_USERNAME" ]] && { echo "[WARN] Sem credenciais, pulando limpeza"; exit 0; }
      curl_harbor() { curl -s -k -u "${HARBOR_USERNAME}:${HARBOR_PASSWORD}" "$@"; }

      for project in $(curl_harbor "https://${HARBOR_REGISTRY}/api/v2.0/projects?page_size=100" | jq -r '.[]?.name // empty'); do
        [[ -z "$project" ]] && continue
        echo "[$(date '+%d/%m/%Y %H:%M:%S')] [INFO] Verificando projeto: $project"

        for repo in $(curl_harbor "https://${HARBOR_REGISTRY}/api/v2.0/projects/$project/repositories?page_size=100" | jq -r '.[]?.name // empty'); do
          [[ -z "$repo" ]] && continue
          repo_name="${repo#*/}"
          count=0

          artifacts=$(curl_harbor "https://${HARBOR_REGISTRY}/api/v2.0/projects/$project/repositories/$repo_name/artifacts?page_size=100" 2>/dev/null)

          if ! echo "$artifacts" | jq empty 2>/dev/null; then
            continue
          fi

          echo "[$(date '+%d/%m/%Y %H:%M:%S')] [INFO] Verificar/remover imagens sem tags em $repo"

          while read -r digest; do
            [[ -z "$digest" ]] && continue

            if curl_harbor -X DELETE "https://${HARBOR_REGISTRY}/api/v2.0/projects/$project/repositories/$repo_name/artifacts/$digest" -o /dev/null -w "%{http_code}" 2>/dev/null | grep -q "^20[0-9]$"; then
              echo "[$(date '+%d/%m/%Y %H:%M:%S')] [OK] Removido: $repo@${digest:7:12}"
              count=$((count + 1))
            else
              echo "[$(date '+%d/%m/%Y %H:%M:%S')] [ERROR] Falha ao remover: $repo@${digest:7:12}"
            fi
          done <<< "$(echo "$artifacts" | jq -r '.[] | select(.tags == null) | .digest // empty' 2>/dev/null)"

          [[ $count -gt 0 ]] && echo "[$(date '+%d/%m/%Y %H:%M:%S')] [INFO] $repo: $count imagens removidas"
        done
      done
    - |
      docker logout ${HARBOR_REGISTRY} 2>/dev/null || true
      docker system prune -f --filter "until=24h"
      rm -f ~/.docker/config.json
      rm -f /tmp/.docker-*
  allow_failure: false

# STAGE 9
development:deploy:
  stage: development
  image: ${BASE_IMAGE}
  tags:
    - kubernetes
  interruptible: true
  retry:
    max: 1
    when:
      - runner_system_failure
  timeout: 20m
  variables:
    DEPLOY_ENV: dev
    APP_NAMESPACE: "${APP_NAME}-dev"
    KUSTOMIZE_PATH: kustomize/overlays/development
    GIT_BRANCH: develop
    ARGOCD_TIMEOUT: "${ARGOCD_TIMEOUT_DEV}"
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
  before_script:
    - *load_k8s_secrets
    - echo "[$(date '+%d/%m/%Y %H:%M:%S')] [INFO] GitOps Development Deploy - ArgoCD"
    - echo "[$(date '+%d/%m/%Y %H:%M:%S')] [INFO] Branch ${CI_COMMIT_BRANCH:-} | Commit ${CI_COMMIT_SHORT_SHA}"
  script:
    - echo "[$(date '+%d/%m/%Y %H:%M:%S')] [INFO] ETAPA 1 - Atualizar Image Tag dev no Git"
    - cd ${CI_PROJECT_DIR}/${KUSTOMIZE_PATH}
    - IMAGE_TAG="dev-${CI_COMMIT_SHORT_SHA}"
    - echo "[$(date '+%d/%m/%Y %H:%M:%S')] [INFO] Setting image to ${DOCKER_IMAGE}:${IMAGE_TAG}"
    - kustomize edit set image ${DOCKER_IMAGE}:${IMAGE_TAG}
    - |
      if git diff --quiet kustomization.yaml; then
        echo "[$(date '+%d/%m/%Y %H:%M:%S')] [INFO] Nenhuma mudança em kustomization.yaml"
      else
        echo "[$(date '+%d/%m/%Y %H:%M:%S')] [INFO] Garantindo checkout na branch develop"
        git checkout -B develop

        echo "[$(date '+%d/%m/%Y %H:%M:%S')] [INFO] Commitando mudança de image tag"
        git config user.email "${GIT_AUTHOR_EMAIL}"
        git config user.name "${GIT_AUTHOR_NAME}"
        git add kustomization.yaml
        git commit -m "ci: update ${DEPLOY_ENV} image to dev [skip ci]"

        echo "[$(date '+%d/%m/%Y %H:%M:%S')] [INFO] Fazendo fetch do remote"
        git fetch https://${TOKEN_PAT_NAME}:${TOKEN_PAT_ACCESS}@${REPO_DOMAIN}/${REPO_PATH}.git develop

        echo "[$(date '+%d/%m/%Y %H:%M:%S')] [INFO] Tentando push com retry"
        PUSH_OK=false
        for i in {1..3}; do
          if git rebase FETCH_HEAD; then
            if git push https://${TOKEN_PAT_NAME}:${TOKEN_PAT_ACCESS}@${REPO_DOMAIN}/${REPO_PATH}.git develop -o ci.skip; then
              echo "[$(date '+%d/%m/%Y %H:%M:%S')] [OK] Image tag atualizada no Git (tentativa $i)"
              PUSH_OK=true
              break
            fi
          else
            echo "[$(date '+%d/%m/%Y %H:%M:%S')] [WARN] Rebase falhou na tentativa $i"
            git rebase --abort 2>/dev/null || true
          fi
          if [ $i -lt 3 ]; then
            echo "[$(date '+%d/%m/%Y %H:%M:%S')] [WARN] Tentativa $i falhou, aguardando"
            sleep 3
            git fetch https://${TOKEN_PAT_NAME}:${TOKEN_PAT_ACCESS}@${REPO_DOMAIN}/${REPO_PATH}.git develop
          fi
        done

        if [ "$PUSH_OK" = false ]; then
          echo "[$(date '+%d/%m/%Y %H:%M:%S')] [ERROR] Push falhou após 3 tentativas"
          exit 1
        fi
      fi

    - cd ${CI_PROJECT_DIR}
    - echo "[$(date '+%d/%m/%Y %H:%M:%S')] [INFO] ETAPA 2 - Verificar ArgoCD Server (C2)"
    - |
      if ! curl -s --max-time 10 https://${ARGOCD_SERVER}/healthz | grep -q "ok"; then
        echo "[$(date '+%d/%m/%Y %H:%M:%S')] [ERROR] ArgoCD Server (C2) não acessível!"
        echo "[$(date '+%d/%m/%Y %H:%M:%S')] [INFO] URL: https://${ARGOCD_SERVER}/healthz"
        exit 1
      fi

    - echo "[$(date '+%d/%m/%Y %H:%M:%S')] [INFO] ETAPA 3 - Gerar Manifests ArgoCD"
    - envsubst < argocd/argocd-appproject.yaml.template > /tmp/argocd-appproject-${DEPLOY_ENV}.yaml
    - envsubst < argocd/argocd-applicationset.yaml.template > /tmp/argocd-applicationset-${DEPLOY_ENV}.yaml

    - echo "[$(date '+%d/%m/%Y %H:%M:%S')] [INFO] ETAPA 4 - Conectar ao Cluster Main K8S"
    - echo "${KUBECONFIG_HA}" | base64 -d > ${KUBECONFIG}
    - chmod 600 ${KUBECONFIG}
    - export KUBECONFIG=${KUBECONFIG}
    - |
      if kubectl cluster-info 2>&1 | grep -q "Kubernetes control plane"; then
        echo "[$(date '+%d/%m/%Y %H:%M:%S')] [OK] Conectado ao cluster C2"
      else
        echo "[$(date '+%d/%m/%Y %H:%M:%S')] [ERROR] Falha ao conectar ao cluster"
        exit 1
      fi
    - |
      if kubectl get namespace argocd &>/dev/null; then
        echo "[$(date '+%d/%m/%Y %H:%M:%S')] [OK] Namespace argocd existe"
      else
        echo "[$(date '+%d/%m/%Y %H:%M:%S')] [ERROR] Namespace argocd não encontrado"
        exit 1
      fi

    - echo "[$(date '+%d/%m/%Y %H:%M:%S')] [INFO] ETAPA 5 - Autenticar no ArgoCD"

    - |
      echo "[$(date '+%d/%m/%Y %H:%M:%S')] [INFO] Obtendo senha do admin"
      ARGOCD_PASSWORD=$(kubectl get secret argocd-initial-admin-secret \
        -n argocd \
        -o jsonpath='{.data.password}' 2>/dev/null | base64 -d)

      if [ -z "${ARGOCD_PASSWORD}" ]; then
        echo "[$(date '+%d/%m/%Y %H:%M:%S')] [ERROR] Senha do admin não encontrada no secret"
        echo "[$(date '+%d/%m/%Y %H:%M:%S')] [INFO] Verificando se secret existe"
        kubectl get secret argocd-initial-admin-secret -n argocd
        exit 1
      fi

    - |
      if ! command -v argocd &>/dev/null; then
        echo "[$(date '+%d/%m/%Y %H:%M:%S')] [ERROR] argocd CLI não está instalado"
        exit 1
      fi
      ARGOCD_VERSION=$(argocd version --client --short 2>/dev/null || echo 'unknown')
      echo "[$(date '+%d/%m/%Y %H:%M:%S')] [OK] argocd CLI disponível (versão: ${ARGOCD_VERSION})"

    - |
      echo "[$(date '+%d/%m/%Y %H:%M:%S')] [INFO] Fazendo login no ArgoCD"
      LOGIN_OUTPUT=$(argocd login ${ARGOCD_SERVER} \
        --username admin \
        --password ${ARGOCD_PASSWORD} \
        --grpc-web \
        ${ARGOCD_TLS_OPTS} 2>&1)
      if [ $? -eq 0 ]; then
        echo "[$(date '+%d/%m/%Y %H:%M:%S')] [OK] Login bem-sucedido"
      else
        echo "[$(date '+%d/%m/%Y %H:%M:%S')] [ERROR] Falha no login do ArgoCD"
        echo "[$(date '+%d/%m/%Y %H:%M:%S')] [DEBUG] ${LOGIN_OUTPUT}"
        exit 1
      fi

    - echo "[$(date '+%d/%m/%Y %H:%M:%S')] [INFO] ETAPA 6 - Adicionar Repositório Git"
    - |
      REPO_OUTPUT=$(argocd repo add ${REPO_URL} \
        --username ${TOKEN_PAT_NAME} \
        --password ${TOKEN_PAT_ACCESS} \
        --grpc-web \
        ${ARGOCD_TLS_OPTS} 2>&1)

      echo "${REPO_OUTPUT}" | tee /tmp/repo-add.log

      if echo "${REPO_OUTPUT}" | grep -q "already exists"; then
        echo "[$(date '+%d/%m/%Y %H:%M:%S')] [WARN] Repositório já existe (ignorando)"
      elif echo "${REPO_OUTPUT}" | grep -qi "error"; then
        echo "[$(date '+%d/%m/%Y %H:%M:%S')] [ERROR] Falha ao adicionar repositório"
        echo "[$(date '+%d/%m/%Y %H:%M:%S')] [DEBUG] ${REPO_OUTPUT}"
        exit 1
      else
        echo "[$(date '+%d/%m/%Y %H:%M:%S')] [OK] Repositório adicionado"
      fi

    - echo "[$(date '+%d/%m/%Y %H:%M:%S')] [INFO] ETAPA 7 - Aplicar AppProject e ApplicationSet"
    - |
      if kubectl apply -f /tmp/argocd-appproject-${DEPLOY_ENV}.yaml -n argocd; then
        echo "[$(date '+%d/%m/%Y %H:%M:%S')] [OK] AppProject aplicado"
      else
        echo "[$(date '+%d/%m/%Y %H:%M:%S')] [ERROR] Falha ao aplicar AppProject"
        exit 1
      fi
    - |
      echo "[$(date '+%d/%m/%Y %H:%M:%S')] [INFO] Aplicando ApplicationSet"
      if kubectl apply -f /tmp/argocd-applicationset-${DEPLOY_ENV}.yaml -n argocd; then
        echo "[$(date '+%d/%m/%Y %H:%M:%S')] [OK] ApplicationSet aplicado"
      else
        echo "[$(date '+%d/%m/%Y %H:%M:%S')] [ERROR] Falha ao aplicar ApplicationSet"
        exit 1
      fi

    - echo "[$(date '+%d/%m/%Y %H:%M:%S')] [INFO] ETAPA 8 - Aguardar Application e Sync"
    - sleep 17
    - |
      echo "[$(date '+%d/%m/%Y %H:%M:%S')] [INFO] Verificando se Application foi criada"
      TIMEOUT=60
      ELAPSED=0
      while [[ $ELAPSED -lt $TIMEOUT ]]; do
        if kubectl get application ${APP_NAME}-dev -n argocd &>/dev/null; then
          echo "[$(date '+%d/%m/%Y %H:%M:%S')] [OK] Application ${APP_NAME}-dev criada"
          FOUND_APP=1
          break
        fi
        sleep 5
        ELAPSED=$((ELAPSED + 5))
      done

      if [[ -z "${FOUND_APP}" ]]; then
        echo "[$(date '+%d/%m/%Y %H:%M:%S')] [ERROR] Application não foi criada pelo ApplicationSet após $TIMEOUT segundos"
        echo "[$(date '+%d/%m/%Y %H:%M:%S')] [INFO] Verificando ApplicationSet"
        kubectl get applicationset -n argocd | grep ${APP_NAME} || echo "[WARN] ApplicationSet não encontrado"
        exit 1
      fi

      echo "[$(date '+%d/%m/%Y %H:%M:%S')] [INFO] Aguardando sync da application"
      argocd app wait ${APP_NAME}-dev \
        --server ${ARGOCD_SERVER} \
        --grpc-web \
        --timeout ${ARGOCD_TIMEOUT} 2>&1 | tee /tmp/app-wait.log || {
          echo "[$(date '+%d/%m/%Y %H:%M:%S')] [WARN] Timeout ao aguardar sync (verificar ArgoCD UI)"
      }

      APP_STATUS=$(kubectl get application ${APP_NAME}-dev -n argocd -o jsonpath='{.status.health.status}' 2>/dev/null || echo "Unknown")
      SYNC_STATUS=$(kubectl get application ${APP_NAME}-dev -n argocd -o jsonpath='{.status.sync.status}' 2>/dev/null || echo "Unknown")

      echo "[$(date '+%d/%m/%Y %H:%M:%S')] [INFO] Application Status Final:"
      echo "  • Health: ${APP_STATUS}"
      echo "  • Sync: ${SYNC_STATUS}"

      if [[ "${SYNC_STATUS}" == "Synced" ]]; then
        echo "[$(date '+%d/%m/%Y %H:%M:%S')] [SUCCESS] Deploy concluído - Application sincronizada"
        if [[ "${APP_STATUS}" == "Healthy" ]]; then
          echo "[$(date '+%d/%m/%Y %H:%M:%S')] [SUCCESS] Todos os recursos healthy"
        elif [[ "${APP_STATUS}" == "Progressing" ]]; then
          echo "[$(date '+%d/%m/%Y %H:%M:%S')] [WARNING] Alguns recursos em Progressing (normal para HAProxy Ingress)"
          echo "[$(date '+%d/%m/%Y %H:%M:%S')] [INFO] O Ingress com HAProxy pode permanecer em Progressing devido ao health check externo"
        else
          echo "[$(date '+%d/%m/%Y %H:%M:%S')] [WARNING] Health status: ${APP_STATUS} - Verificar detalhes no ArgoCD UI"
        fi
      else
        echo "[$(date '+%d/%m/%Y %H:%M:%S')] [ERROR] Application não sincronizada - Verificar logs do ArgoCD"
        exit 1
      fi
  after_script:
    - echo "[$(date '+%d/%m/%Y %H:%M:%S')] [INFO] Limpeza"
    - rm -f ${KUBECONFIG} /tmp/argocd-*.yaml /tmp/*.log 2>/dev/null || true
    - echo "[$(date '+%d/%m/%Y %H:%M:%S')] [INFO] Pipeline finalizada com status ${CI_JOB_STATUS}"
  allow_failure: false

# STAGE 10
staging:deploy:
  stage: staging
  image: ${BASE_IMAGE}
  tags:
    - kubernetes
  interruptible: true
  retry:
    max: 1
    when:
      - runner_system_failure
  timeout: 20m
  variables:
    DEPLOY_ENV: stg
    APP_NAMESPACE: "${APP_NAME}-stg"
    KUSTOMIZE_PATH: kustomize/overlays/staging
    ARGOCD_TIMEOUT: "${ARGOCD_TIMEOUT_STG}"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
  before_script:
